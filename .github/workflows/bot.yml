name: Run Telegram voice bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: telegram-voice-bot
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      API_ID: ${{ secrets.API_ID }}
      API_HASH: ${{ secrets.API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SESSION_STRING: ${{ secrets.SESSION_STRING }}
      TARGET_CHAT_ID: ${{ secrets.TARGET_CHAT_ID }}
      YOUTUBE_CHAT_ID: ${{ secrets.YOUTUBE_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install system audio dependency
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Start bot
        shell: bash
        run: |
          # Let the workflow restart the bot after 5 hours and 30 minutes.
          set +e
          timeout --signal=TERM 19800 python bot.py
          exit_code=$?
          echo "bot.py exited with code ${exit_code}; starting a fresh workflow"

      # ─── إعادة تشغيل البوت فوراً بعد الانتهاء (يقلل التأخير إلى ~30 ثانية) ───
      - name: Auto-restart bot
        # لا تعِد تشغيله إذا كان GitHub قد ألغى هذا التشغيل
        # بسبب بدء تشغيل أحدث.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          gh workflow run run-bot.yml \
            --repo ${{ github.repository }} \
            --ref ${{ github.ref_name }}
